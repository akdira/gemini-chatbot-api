<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexa – Konsultan Hukum AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="sparkle-gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4285f4" />
        <stop offset="55%" stop-color="#9b72cb" />
        <stop offset="100%" stop-color="#d96570" />
      </linearGradient>
      <symbol id="sparkle" viewBox="0 0 24 24">
        <path fill="url(#sparkle-gradient)" d="M12 2C12 7.5 16.5 12 22 12C16.5 12 12 16.5 12 22C12 16.5 7.5 12 2 12C7.5 12 12 7.5 12 2Z" />
      </symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Lexa</span>
      <span class="brand-tag">Konsultan Hukum AI</span>
    </div>
    <button type="button" id="new-chat" class="icon-btn" title="Percakapan baru" aria-label="Percakapan baru">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2Z" /></svg>
    </button>
  </header>

  <main class="main">
    <section id="welcome" class="welcome">
      <h1 class="greeting">Halo, saya Lexa</h1>
      <p class="subgreeting">Ada masalah hukum apa yang bisa saya bantu?</p>

      <div class="suggestions">
        <button type="button" class="chip" data-prompt="Saya di-PHK tanpa pesangon setelah bekerja 3 tahun. Apa hak saya?">
          <span>Di-PHK tanpa pesangon, apa hak saya?</span>
          <span class="chip-icon">💼</span>
        </button>
        <button type="button" class="chip" data-prompt="Teman saya meminjam uang 20 juta dan tidak mau mengembalikan. Apa langkah hukumnya?">
          <span>Teman pinjam uang tidak dikembalikan</span>
          <span class="chip-icon">💸</span>
        </button>
        <button type="button" class="chip" data-prompt="Apa saja hal penting yang harus dicek sebelum menandatangani kontrak sewa rumah?">
          <span>Cek kontrak sewa sebelum tanda tangan</span>
          <span class="chip-icon">📝</span>
        </button>
        <button type="button" class="chip" data-prompt="Bagaimana prosedur dan syarat mengajukan gugatan cerai di Indonesia?">
          <span>Prosedur gugatan cerai di Indonesia</span>
          <span class="chip-icon">⚖️</span>
        </button>
      </div>
    </section>

    <div id="chat-box" class="chat-box" aria-live="polite"></div>
  </main>

  <footer class="composer">
    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Ceritakan masalah hukum Anda..." autocomplete="off" required />
      <button type="submit" class="send-btn" aria-label="Kirim">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 20V4l19 8-19 8Zm2-3 11.85-5L5 7v3.5l6 1.5-6 1.5V17Z" /></svg>
      </button>
    </form>
    <p class="disclaimer">Lexa dapat membuat kesalahan. Jawaban bersifat informasi umum, bukan nasihat hukum resmi.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
